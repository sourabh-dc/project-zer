name: Deploy Orders Service (API + Worker)

on:
  push:
    paths:
      - "orders_service/**"
      - "shared/**"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  # ── Build & Push Images ──────────────────────────────────────────
  build:
    if: github.ref == 'refs/heads/production' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component:
          - name: api
            dockerfile: orders_service/Dockerfile
            image: ${{ secrets.ACR_NAME }}.azurecr.io/orders-api
          - name: worker
            dockerfile: orders_service/Dockerfile.worker
            image: ${{ secrets.ACR_NAME }}.azurecr.io/orders-worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push ${{ matrix.component.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.component.dockerfile }}
          push: true
          tags: |
            ${{ matrix.component.image }}:${{ github.sha }}
            ${{ matrix.component.image }}:latest

  # ── Deploy API ───────────────────────────────────────────────────
  deploy-api:
    if: github.ref == 'refs/heads/production' || github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy orders-api
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: orders-api
          resourceGroup: ${{ secrets.RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.ACR_NAME }}.azurecr.io/orders-api:${{ github.sha }}

  # ── Deploy Worker ────────────────────────────────────────────────
  deploy-worker:
    if: github.ref == 'refs/heads/production' || github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy orders-worker
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: orders-worker
          resourceGroup: ${{ secrets.RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.ACR_NAME }}.azurecr.io/orders-worker:${{ github.sha }}
