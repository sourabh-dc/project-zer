name: Deploy Data Intelligence Service

on:
  push:
    paths:
      - "data_intelligence_service/**"
      - "shared/**"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  # ── Build & Push ─────────────────────────────────────────────────
  build:
    if: github.ref == 'refs/heads/production' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: data_intelligence_service/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/data-intelligence-api:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/data-intelligence-api:latest

  # ── Deploy ───────────────────────────────────────────────────────
  deploy:
    if: github.ref == 'refs/heads/production' || github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy data-intelligence-api
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: data-intelligence-api
          resourceGroup: ${{ secrets.RESOURCE_GROUP }}
          imageToDeploy: ${{ secrets.ACR_NAME }}.azurecr.io/data-intelligence-api:${{ github.sha }}
