# ===================================================================
# ZeroQue - centralized Alembic configuration
#
# Single migration repo for ALL services sharing the platform Postgres.
# Run from the REPO ROOT:
#
#   alembic -c db/alembic.ini upgrade head
#   alembic -c db/alembic.ini revision --autogenerate -m "message"
#   alembic -c db/alembic.ini current / history / stamp head
#
# Connection string comes from the DATABASE_URL env var (never committed).
# ===================================================================

[alembic]
# %(here)s = directory of this ini file — works from any cwd.
script_location = %(here)s
version_path_separator = os

# Placeholder only - env.py overrides with DATABASE_URL at runtime.
sqlalchemy.url = postgresql://zeroque:zeroque@localhost:5432/zeroque_dev

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
